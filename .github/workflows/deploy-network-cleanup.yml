name: Limpar regras SSH expiradas

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      test_access:
        description: Testar OIDC, regra SSH e consulta de status, sem alterar containers
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prod-network-sweep
  cancel-in-progress: false

jobs:
  sweep:
    if: >-
      github.ref == 'refs/heads/main' &&
      (vars.PROD_CD_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: aws
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: fm-cleanup-${{ github.run_id }}
          role-duration-seconds: 900
      - name: Revogar somente regras gerenciadas e expiradas
        env:
          DEPLOY_SECURITY_GROUP_ID: ${{ vars.DEPLOY_SECURITY_GROUP_ID }}
        run: python3 scripts/deploy-network.py sweep
      - name: Testar abertura de SSH temporário
        id: network
        if: github.event_name == 'workflow_dispatch' && inputs.test_access
        env:
          DEPLOY_SECURITY_GROUP_ID: ${{ vars.DEPLOY_SECURITY_GROUP_ID }}
        run: python3 scripts/deploy-network.py open
      - name: Consultar status pela chave restrita, sem alterar a aplicação
        if: github.event_name == 'workflow_dispatch' && inputs.test_access
        env:
          DEPLOY_ACTION: status
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: python3 scripts/deploy-ssh.py
      - name: Revogar regra do teste mesmo em caso de falha
        if: always() && steps.aws.outcome == 'success' && steps.network.outcome != 'skipped'
        env:
          DEPLOY_SECURITY_GROUP_ID: ${{ vars.DEPLOY_SECURITY_GROUP_ID }}
        run: python3 scripts/deploy-network.py close
