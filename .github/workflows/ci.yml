name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a production operation when another commit arrives.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar Gitleaks 8.30.1 com checksum fixado
        shell: bash
        run: |
          set -euo pipefail
          directory=$(mktemp -d)
          trap 'rm -rf "$directory"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$directory/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$directory/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$directory/gitleaks.tar.gz" -C "$directory" gitleaks
          mkdir -p "$RUNNER_TEMP/security-bin"
          install -m 755 "$directory/gitleaks" "$RUNNER_TEMP/security-bin/gitleaks"
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"
      - name: Verificar detecção e limites das exceções com dados sintéticos
        run: python3 scripts/security-scan-selftest.py
      - name: Varrer histórico alcançável
        run: gitleaks git --config .gitleaks.toml --redact=100 --no-banner --log-opts=--all .

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Testes e empacotamento
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Sanitizar relatórios
        if: always()
        run: python3 ../scripts/sanitize-reports.py --backend target/surefire-reports --revision "${{ github.sha }}" --output target/validation-summary.json
      - name: Relatórios de testes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-tests-${{ github.sha }}
          path: backend/target/validation-summary.json
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Testar configuração inicial
        run: node --test scripts/init-env.test.mjs
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Testar dinheiro, CSV, comparação mensal, tema e pacote
        run: node --test scripts/*.test.mjs
      - name: Testar ferramentas de backup
        run: python3 -m unittest discover -s scripts -p "*_test.py"
      - name: Lint, tipos e build
        working-directory: frontend
        run: npm run check

  containers:
    needs: [backend, frontend, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: finance-manager-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Preparar variáveis de teste
        run: node scripts/init-env.mjs
      - name: Validar configuração dos serviços
        run: docker compose -f compose.app.yml config --quiet
      - name: Construir e iniciar aplicação
        run: docker compose -f compose.app.yml up --build --detach --wait --wait-timeout 180
      - name: Validar fluxo integrado
        env:
          SMOKE_API_URL: http://localhost:8080
          SMOKE_FRONTEND_URL: http://localhost:3000
        run: node scripts/smoke-test.mjs
      - name: Instalar suíte de navegador
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Testar interface real
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npm run test:e2e
      - name: Sanitizar relatório de navegador
        if: always()
        run: python3 scripts/sanitize-reports.py --browser frontend/test-results/results.json --revision "${{ github.sha }}" --output frontend/test-results/summary.json
      - name: Relatório sanitizado de navegador
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-tests-${{ github.sha }}
          path: frontend/test-results/summary.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Encerrar ambiente de teste
        if: always()
        run: docker compose -f compose.app.yml down --volumes --remove-orphans

  publish:
    needs: [containers]
    if: >-
      vars.PROD_CD_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.images.outputs.backend }}
      frontend: ${{ steps.images.outputs.frontend }}
      migrations: ${{ steps.images.outputs.migrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publicar imagens da revisão aprovada
        id: images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/ghcr-auth"
          mkdir -m 700 -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          namespace="ghcr.io/${REPOSITORY,,}"
          docker buildx create --name cd-builder --driver docker-container --use
          for service in backend frontend; do
            args=()
            if [[ "$service" == frontend ]]; then
              args+=(--build-arg NEXT_PUBLIC_API_URL=/api)
            fi
            docker buildx build --platform linux/amd64 --push \
              --tag "$namespace-$service:$RELEASE_SHA" \
              --label "org.opencontainers.image.revision=$RELEASE_SHA" \
              --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
              --metadata-file "$RUNNER_TEMP/$service.json" \
              "${args[@]}" "./$service"
            digest=$(jq -er '.["containerimage.digest"]' "$RUNNER_TEMP/$service.json")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s=%s-%s@%s\n' "$service" "$namespace" "$service" "$digest" >> "$GITHUB_OUTPUT"
            printf '%s: `%s-%s@%s`\n' "$service" "$namespace" "$service" "$digest" >> "$GITHUB_STEP_SUMMARY"
          done
          printf 'migrations=%s\n' "$(git rev-parse "$RELEASE_SHA:backend/src/main/resources/db/migration")" >> "$GITHUB_OUTPUT"
          printf 'Commit: `%s`\n' "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [publish]
    if: vars.PROD_CD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: prod
      url: ${{ vars.PROD_URL }}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Impedir entrega obsoleta após espera ou aprovação
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$head" = "$RELEASE_SHA"
      - name: Validar configuração de acesso OIDC
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          DEPLOY_SECURITY_GROUP_ID: ${{ vars.DEPLOY_SECURITY_GROUP_ID }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_ROLE_ARN" == "arn:aws:iam::$AWS_ACCOUNT_ID:role/"* ]]
          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[1-9]$ ]]
          [[ "$DEPLOY_SECURITY_GROUP_ID" =~ ^sg-[0-9a-f]{8,17}$ ]]
          test "$DEPLOY_PORT" = 22
      - name: Autenticar na AWS via OIDC
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: fm-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
      - name: Liberar SSH somente para o IPv4 deste runner
        id: network
        env:
          DEPLOY_SECURITY_GROUP_ID: ${{ vars.DEPLOY_SECURITY_GROUP_ID }}
        run: python3 scripts/deploy-network.py open
      - name: Atualizar EC2 e validar saúde com rollback protegido
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_REGISTRY_USER: ${{ github.actor }}
          DEPLOY_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
          MIGRATIONS_SHA: ${{ needs.publish.outputs.migrations }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.backend }}
          FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend }}
        run: python3 scripts/deploy-ssh.py
      - name: Revogar a regra SSH temporária desta execução
        if: always() && steps.aws.outcome == 'success' && steps.network.outcome != 'skipped'
        env:
          DEPLOY_SECURITY_GROUP_ID: ${{ vars.DEPLOY_SECURITY_GROUP_ID }}
        run: python3 scripts/deploy-network.py close
      - name: Registrar resultado
        if: always()
        env:
          RESULT: ${{ job.status }}
          RELEASE_SHA: ${{ github.sha }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.backend }}
          FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend }}
        run: |
          printf 'CD: %s\nCommit: `%s`\nBackend: `%s`\nFrontend: `%s`\n' \
            "$RESULT" "$RELEASE_SHA" "$BACKEND_IMAGE" "$FRONTEND_IMAGE" >> "$GITHUB_STEP_SUMMARY"
