name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Testes e empacotamento
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Sanitizar relatórios
        if: always()
        run: python3 ../scripts/sanitize-reports.py --backend target/surefire-reports --revision "${{ github.sha }}" --output target/validation-summary.json
      - name: Relatórios de testes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-tests-${{ github.sha }}
          path: backend/target/validation-summary.json
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Testar configuração inicial
        run: node --test scripts/init-env.test.mjs
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Testar dinheiro, CSV, comparação mensal, tema e pacote
        run: node --test scripts/*.test.mjs
      - name: Testar ferramentas de backup
        run: python3 -m unittest discover -s scripts -p "*_test.py"
      - name: Lint, tipos e build
        working-directory: frontend
        run: npm run check

  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: finance-manager-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Preparar variáveis de teste
        run: node scripts/init-env.mjs
      - name: Validar configuração dos serviços
        run: docker compose -f compose.app.yml config --quiet
      - name: Construir e iniciar aplicação
        run: docker compose -f compose.app.yml up --build --detach --wait --wait-timeout 180
      - name: Validar fluxo integrado
        env:
          SMOKE_API_URL: http://localhost:8080
          SMOKE_FRONTEND_URL: http://localhost:3000
        run: node scripts/smoke-test.mjs
      - name: Instalar suíte de navegador
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Testar interface real
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npm run test:e2e
      - name: Sanitizar relatório de navegador
        if: always()
        run: python3 scripts/sanitize-reports.py --browser frontend/test-results/results.json --revision "${{ github.sha }}" --output frontend/test-results/summary.json
      - name: Relatório sanitizado de navegador
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-tests-${{ github.sha }}
          path: frontend/test-results/summary.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Encerrar ambiente de teste
        if: always()
        run: docker compose -f compose.app.yml down --volumes --remove-orphans
