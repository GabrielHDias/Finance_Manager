spring.application.name=financeManager

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finance_manager}
spring.datasource.username=finance_manager
spring.datasource.password=${DB_PASSWORD}

# Do not trust forwarded identity from arbitrary callers. See security runbook.
server.forward-headers-strategy=none
spring.datasource.hikari.connection-timeout=2500
spring.datasource.hikari.validation-timeout=1000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=3600

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
