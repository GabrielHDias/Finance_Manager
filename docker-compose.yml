services:
    postgres:
        image: postgres:17
        container_name: finance-manager-postgres

        environment:
            POSTGRES_DB: finance_manager
            POSTGRES_USER: finance_manager
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Execute node scripts/init-env.mjs}

        ports:
            - "127.0.0.1:${DB_PORT:-5432}:5432"

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U finance_manager -d finance_manager"]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 5s

        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
