services:
    postgres:
        image: postgres:17
        container_name: finance-manager-postgres

        environment:
            POSTGRES_DB: finance_manager
            POSTGRES_USER: finance_manager
            POSTGRES_PASSWORD: ${DB_PASSWORD}

        ports:
            - "5432:5432"

        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
